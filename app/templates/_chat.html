{# Chat drawer, collapsed by default (D-112). Suggestions are about Penwright only. Not part of the demo video. #}
{# The "Ask SubGuard" entry is in the top bar (B6, base.html block topbar_actions); the drawer stays here. #}
<aside class="chat" id="chat" aria-label="Chat with SubGuard" hidden>
  <header class="chat-head">
    <strong>SubGuard chat</strong>
    <span class="badge badge-llm" data-testid="chat-provider">{{ llm.name }} · {{ llm.model }}</span>
    <button class="btn btn-ghost btn-sm" id="chat-close" aria-label="Close chat" data-testid="chat-close">✕</button>
  </header>
  <div class="chat-log" id="chat-log" aria-live="polite"></div>
  <div class="chat-suggest" id="chat-suggest" aria-label="Suggested questions">
    <button type="button" class="btn btn-ghost btn-sm chip-q" data-testid="chat-chip-keep">Should I keep it?</button>
    <button type="button" class="btn btn-ghost btn-sm chip-q" data-testid="chat-chip-nothing">What happens if I do nothing?</button>
    <button type="button" class="btn btn-ghost btn-sm chip-q" data-testid="chat-chip-email">Draft my cancellation email</button>
  </div>
  <form class="chat-form" id="chat-form">
    <label class="sr-only" for="chat-input">Message</label>
    <input id="chat-input" data-testid="chat-input" autocomplete="off" placeholder="Ask about Penwright…">
    <button class="btn" data-testid="chat-send">Send</button>
  </form>
</aside>
