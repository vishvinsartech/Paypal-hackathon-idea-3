{# U9 "Show all" / presenter "Show audit log": the full hash-chained log. Routine PayPal reads hidden (U26). #}
<dialog id="audit-drawer" class="dialog drawer" aria-labelledby="audit-h" data-testid="audit-drawer">
  <div class="drawer-head card-head">
    <h2 id="audit-h">Audit log</h2>
    <span id="chain" class="chain" data-testid="audit-chain">checking…</span>
    <button type="button" class="btn btn-ghost btn-sm" data-close-audit aria-label="Close audit log">✕</button>
  </div>
  <div class="card-head drawer-tools">
    <label class="sr-only" for="audit-filter">Filter audit log</label>
    <input id="audit-filter" type="search" placeholder="Filter, e.g. R2" data-testid="audit-filter">
    <label class="small"><input type="checkbox" id="audit-routine" data-testid="audit-routine"> Show routine PayPal checks</label>
    <button class="btn btn-ghost btn-sm" id="audit-export" data-testid="audit-log-export">Export CSV</button>
    <a class="small" href="/api/audit-log.csv">server CSV</a>
  </div>
  <div id="audit-grid" class="grid grid-tall" data-testid="audit-log-grid"></div>
</dialog>

<dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title"></dialog>
