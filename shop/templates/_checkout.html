{# Checkout area shared by merchant pages. Expects `merchant`, `plan_key`, `settings`. #}
<div class="checkout" data-testid="shop-checkout" data-merchant="{{ merchant.id }}" data-plan-key="{{ plan_key }}">
  <div id="paypal-area" class="paypal-area" data-testid="shop-paypal-btn">
    {% if settings.is_sandbox %}
    <button type="button" class="paypal-btn" disabled>PayPal checkout loads here (sandbox)</button>
    {% else %}
    <button type="button" class="paypal-btn" data-mock-approve>Approve with PayPal (sandbox mock)</button>
    {% endif %}
  </div>
  {% if merchant.fair_trial_member %}
  <p class="fair-trial" data-testid="fair-trial-badge">&#10003; Protected by SubGuard: cancel anytime</p>
  {% endif %}
</div>
